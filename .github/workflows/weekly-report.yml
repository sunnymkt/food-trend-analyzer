name: 주간 리포트 이메일 발송

on:
  schedule:
    # 매주 월요일 02:04 KST = 일요일 17:04 UTC
    - cron: "4 17 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 파이썬 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 리포트 생성 및 발송
        id: report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
        run: python scripts/generate_weekly_report.py

      # 이 스텝은 continue-on-error 없이 둔다. 메일 발송이 실패하면 워크플로 자체가
      # 실패로 표시되어야 놓치지 않는다. 아카이브 커밋만 always()로 별도 실행해,
      # 발송 실패와 무관하게 이번 주 스냅샷은 저장한다.
      - name: 아카이브 변경사항 커밋 & 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weekly_reports.json data/weekly_reports/*.html
          if git diff --cached --quiet; then
            echo "변경된 아카이브가 없습니다."
            exit 0
          fi
          git commit -m "chore: 푸드트렌드 위클리 아카이브 추가 ($(date -u +%Y-%m-%d))"

          # 같은 시간대에 다른 워크플로(예: 키워드 트렌드 수집)가 먼저 main에
          # push해두면 여기서 non-fast-forward로 거부될 수 있다. 원격 변경사항을
          # rebase로 받아온 뒤 재시도한다 (최대 5회, 매번 원격을 다시 fetch).
          max_attempts=5
          attempt=1
          until git push origin main; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::아카이브 푸시 재시도 ${max_attempts}회 모두 실패했습니다."
              exit 1
            fi
            echo "푸시 거부됨 (다른 커밋 선점) — 원격 변경사항을 받아와 재시도합니다 (${attempt}/${max_attempts})"
            git pull --rebase origin main
            attempt=$((attempt + 1))
          done
